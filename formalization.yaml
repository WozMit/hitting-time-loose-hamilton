# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The hitting time for loose Hamilton cycles in r-graphs"
  description: >-
    A Lean formalisation of a hitting time theorem of Wanfang Chen,
    Jared León and Xizhi Liu. For every fixed integer r ≥ 3, assume
    all r-element subsets of n vertices are exposed in a uniformly
    random order. As n tends to infinity through multiples of r − 1,
    with probability tending to one, a loose Hamilton cycle first
    emerges exactly when the last isolated vertex disappears.
  authors:
    - "Jared León"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jared León"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C65", "05C80"]

sources:
  - title: "The hitting time for loose Hamilton cycles in r-graphs"
    type: "original-proof"
    relationship: "other"
  - title: "Internal proof"
    contributors:
      - name: "Wanfang Chen"
        role: "proof author"
      - name: "Jared León"
        role: "proof author"
      - name: "Xizhi Liu"
        role: "proof author"
    relationship: "background"
  - title: "Asymptotics for Shamir's Problem"
    authors: ["Jeff Kahn"]
    type: "paper"
    id: "https://doi.org/10.1016/j.aim.2023.109019"
    relationship: "background"
    note: >-
      Theorem 4.2 supplies a required entropy estimate and is
      formalised within this repository.

related_formalizations: []

status:
  scope: >-
    Complete, with no unproved steps. Nothing is assumed from the
    literature. The theorem is proved from Mathlib alone.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: []
      framework: "OpenAI ChatGPT"
      tool_setup: >-
        Responsible for writing substantially all of the repository’s
        Lean source code under the author's guidance and review. This
        involved choosing the Lean formalisations, working through and
        repairing proofs, and devising the certificate machinery. The
        author established the targets, supplied the underlying
        informal proofs and phased roadmaps, made the overarching
        mathematical decisions, and reviewed the output throughout.

fidelity:
  divergences: >-
    Only theorem 4.2 from Kahn's work [Kahn, J. (2023). Asymptotics
    for Shamir's problem. Advances in Mathematics, 422, 109019] was
    formalised in this repository.

review:
  status: "self-assessed"
  reviewers:
    - "Jared León"
  notes: >-
    The author oversaw and reviewed the development as it
    progressed. No external or independent review has been conducted,
    and the Lean source code has not been read by other
    mathematicians. Correctness is instead established mechanically:
    Lean checks every inference step, while
    scripts/verify-comparator.sh validates trust assumptions.

alignment:
  namespace: "HittingTimeLooseHamilton"
  statements:
    - source: "Chen, León, Liu, Internal proof"
      lean: "HittingTimeLooseHamilton.main_result"
      module: "Solution"
      status: "proved"
